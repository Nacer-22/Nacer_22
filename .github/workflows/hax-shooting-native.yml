name: HAX SHOOTING Server Rules CI
on:
  push:
    branches: [hax-shooting-dev]
    paths:
      - 'HAX_SHOOTING_NATIVE/server/**'
      - '.github/workflows/hax-shooting-native.yml'
  pull_request:
    paths:
      - 'HAX_SHOOTING_NATIVE/server/**'
      - '.github/workflows/hax-shooting-native.yml'
  workflow_dispatch:
jobs:
  room-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HAX_SHOOTING_NATIVE/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
