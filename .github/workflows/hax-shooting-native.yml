name: HAX SHOOTING Native Validation
on:
  push:
    branches: [hax-shooting-dev]
    paths:
      - 'HAX_SHOOTING_NATIVE/**'
      - '.github/workflows/hax-shooting-native.yml'
  pull_request:
    paths:
      - 'HAX_SHOOTING_NATIVE/**'
      - '.github/workflows/hax-shooting-native.yml'
  workflow_dispatch:
jobs:
  native-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -L --fail -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Import and parse project
        run: ./.godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path HAX_SHOOTING_NATIVE --quit
      - name: Headless startup smoke test
        run: ./.godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path HAX_SHOOTING_NATIVE --quit-after 5
  room-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HAX_SHOOTING_NATIVE/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node --check src/index.js
