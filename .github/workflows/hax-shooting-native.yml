name: HAX SHOOTING Android APK
on:
  push:
    branches: [hax-shooting-dev]
    paths:
      - 'HAX_SHOOTING_NATIVE/**'
      - '.github/workflows/hax-shooting-native.yml'
  workflow_dispatch:
jobs:
  validate-room-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HAX_SHOOTING_NATIVE/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node --check src/index.js

  build-android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Android SDK components
        uses: android-actions/setup-android@v3
      - name: Install required Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.1" "ndk;28.1.13356709" "cmake;3.10.2.4988404"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Install asset generator dependencies
        working-directory: HAX_SHOOTING_NATIVE
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
      - name: Generate 3D models, PBR maps and audio
        working-directory: HAX_SHOOTING_NATIVE
        run: |
          python tools/generate_assets.py
          python tools/generate_pbr_textures.py
          test -s assets/models/operators/operator_nacar.glb
          test -s assets/models/weapons/hax_ar.glb
          test -s assets/textures/hires/concrete_albedo_2k.jpg
      - name: Download Godot 4.7.2 editor
        shell: bash
        run: |
          curl -fL --retry 3 "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.2" -o godot.zip
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --version
      - name: Install matching Godot export templates
        shell: bash
        run: |
          curl -fL --retry 3 "https://downloads.godotengine.org/?flavor=stable&platform=templates&slug=export_templates.tpz&version=4.7.2" -o export_templates.tpz
          mkdir -p "$RUNNER_TEMP/godot-templates"
          unzip -q export_templates.tpz -d "$RUNNER_TEMP/godot-templates"
          DEST="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$DEST"
          if [ -d "$RUNNER_TEMP/godot-templates/templates" ]; then
            cp -a "$RUNNER_TEMP/godot-templates/templates/." "$DEST/"
          else
            cp -a "$RUNNER_TEMP/godot-templates/." "$DEST/"
          fi
          if [ -f "$RUNNER_TEMP/godot-templates/version.txt" ]; then cp "$RUNNER_TEMP/godot-templates/version.txt" "$DEST/version.txt"; fi
          ls -lh "$DEST"
      - name: Import and parse native project
        working-directory: HAX_SHOOTING_NATIVE
        run: |
          godot --headless --editor --path . --import --quit
      - name: Headless startup smoke test
        working-directory: HAX_SHOOTING_NATIVE
        run: godot --headless --path . --quit-after 8
      - name: Export Android APK
        working-directory: HAX_SHOOTING_NATIVE
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android APK" build/HAX_SHOOTING_unsigned.apk
          test -s build/HAX_SHOOTING_unsigned.apk
      - name: Sign APK with temporary distribution test key
        working-directory: HAX_SHOOTING_NATIVE
        shell: bash
        run: |
          mkdir -p "$HOME/.android" build
          keytool -genkeypair -noprompt -v -keystore "$HOME/.android/hax-shooting-test.keystore" -storepass android -alias haxshooting -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=HAX SHOOTING, OU=NACAR, O=NACAR, L=Alger, S=Algeria, C=DZ"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.1/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.1/apksigner"
          "$ZIPALIGN" -f -p 4 build/HAX_SHOOTING_unsigned.apk build/HAX_SHOOTING_aligned.apk
          "$APKSIGNER" sign --ks "$HOME/.android/hax-shooting-test.keystore" --ks-key-alias haxshooting --ks-pass pass:android --key-pass pass:android --out build/HAX_SHOOTING.apk build/HAX_SHOOTING_aligned.apk
          "$APKSIGNER" verify --verbose build/HAX_SHOOTING.apk
          sha256sum build/HAX_SHOOTING.apk | tee build/SHA256SUMS.txt
          printf "HAX SHOOTING — BY: NACAR_22\nGodot 4.7.2\nBuild: %s\nSigned with a temporary test key; replace with your private release key before public distribution.\n" "$GITHUB_SHA" > build/BUILD_INFO.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: HAX-SHOOTING-APK
          path: |
            HAX_SHOOTING_NATIVE/build/HAX_SHOOTING.apk
            HAX_SHOOTING_NATIVE/build/BUILD_INFO.txt
            HAX_SHOOTING_NATIVE/build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
