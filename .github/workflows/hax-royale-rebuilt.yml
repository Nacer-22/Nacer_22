name: HAX SHOOTING ROYALE — Fresh Android Rebuild
on:
  push:
    branches: [hax-royale-rebuilt]
    paths:
      - 'HAX_ROYALE_REBUILT/**'
      - '.github/workflows/hax-royale-rebuilt.yml'
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate 3D operator, weapon and sound assets
        working-directory: HAX_ROYALE_REBUILT
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements.txt
          python tools/generate_assets.py
          python tools/generate_pbr_textures.py
          test -s assets/models/operators/operator_nacar.glb
          test -s assets/models/operators/operator_arctic.glb
          test -s assets/models/operators/operator_toxic.glb
          test -s assets/models/weapons/hax_ar.glb
          test -s assets/models/weapons/phantom_aw.glb
          test -s assets/audio/rifle_shot.wav
          test -s assets/audio/headshot.wav
          test -s assets/textures/hires/concrete_albedo_2k.jpg
          echo "Generated game content:"
          du -sh assets/models assets/audio assets/textures
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.1" "ndk;28.1.13356709"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Download Godot 4.7.2 editor
        shell: bash
        run: |
          URL="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fL --retry 8 --retry-delay 5 --retry-all-errors "$URL" -o "$RUNNER_TEMP/godot.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          ln -sf "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --version
      - name: Install Android export templates
        shell: bash
        run: |
          URL="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          curl -fL --retry 8 --retry-delay 5 --retry-all-errors "$URL" -o "$RUNNER_TEMP/godot-templates.tpz"
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os
          archive_path = Path(os.environ["RUNNER_TEMP"]) / "godot-templates.tpz"
          dest = Path.home() / ".local/share/godot/export_templates/4.7.2.stable"
          dest.mkdir(parents=True, exist_ok=True)
          wanted = {"android_debug.apk", "android_release.apk", "version.txt"}
          found = set()
          with ZipFile(archive_path) as archive:
              for name in archive.namelist():
                  base = Path(name).name
                  if base in wanted and base not in found:
                      data = archive.read(name)
                      if not data:
                          raise RuntimeError("Empty export template: " + name)
                      (dest / base).write_bytes(data)
                      found.add(base)
                      print("Extracted", name, len(data))
          missing = wanted - found
          if missing:
              raise RuntimeError("Missing Android templates: " + str(sorted(missing)))
          PY
          ls -lh "$HOME/.local/share/godot/export_templates/4.7.2.stable"
      - name: Import project and validate resources
        working-directory: HAX_ROYALE_REBUILT
        run: |
          godot --headless --editor --path . --import --quit
      - name: Headless startup smoke test
        working-directory: HAX_ROYALE_REBUILT
        run: |
          godot --headless --path . --quit-after 8
      - name: Full Battle Royale match smoke test
        working-directory: HAX_ROYALE_REBUILT
        run: |
          godot --headless --path . --script tools/smoke_battle_royale.gd
      - name: Export Android APK
        working-directory: HAX_ROYALE_REBUILT
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android APK" build/HAX_SHOOTING_ROYALE_unsigned.apk
          test -s build/HAX_SHOOTING_ROYALE_unsigned.apk
      - name: Sign and verify APK
        working-directory: HAX_ROYALE_REBUILT
        shell: bash
        run: |
          keytool -genkeypair -noprompt -v -keystore "$RUNNER_TEMP/hax-royale-test.keystore" -storepass android -alias haxroyale -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=HAX SHOOTING ROYALE, OU=NACAR, O=NACAR, L=Alger, S=Algeria, C=DZ"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.1/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.1/apksigner"
          "$ZIPALIGN" -f -p 4 build/HAX_SHOOTING_ROYALE_unsigned.apk build/HAX_SHOOTING_ROYALE_aligned.apk
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/hax-royale-test.keystore" --ks-key-alias haxroyale --ks-pass pass:android --key-pass pass:android --out build/HAX_SHOOTING_ROYALE.apk build/HAX_SHOOTING_ROYALE_aligned.apk
          "$APKSIGNER" verify --verbose build/HAX_SHOOTING_ROYALE.apk
          sha256sum build/HAX_SHOOTING_ROYALE.apk | tee build/SHA256SUMS.txt
          printf "HAX SHOOTING ROYALE\nBY: NACAR_22\nVersion: 1.0.0\nGodot: 4.7.2\nApplication ID: com.nacar.haxroyale\nSigned with a temporary CI test key. Use a private permanent key for production updates.\n" > build/BUILD_INFO.txt
      - name: Package complete native source project
        working-directory: HAX_ROYALE_REBUILT
        run: |
          zip -qr build/HAX_SHOOTING_ROYALE_SOURCE.zip . -x ".godot/*" "build/*" ".git/*"
          test -s build/HAX_SHOOTING_ROYALE_SOURCE.zip
      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: HAX-SHOOTING-ROYALE-APK
          path: |
            HAX_ROYALE_REBUILT/build/HAX_SHOOTING_ROYALE.apk
            HAX_ROYALE_REBUILT/build/SHA256SUMS.txt
            HAX_ROYALE_REBUILT/build/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload source project and generated assets
        uses: actions/upload-artifact@v4
        with:
          name: HAX-SHOOTING-ROYALE-SOURCE
          path: HAX_ROYALE_REBUILT/build/HAX_SHOOTING_ROYALE_SOURCE.zip
          if-no-files-found: error
          retention-days: 30
